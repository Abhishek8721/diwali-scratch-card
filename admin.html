<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Diwali Scratch &amp; Win</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body { font-family: 'Poppins', 'Segoe UI', sans-serif; }
  </style>
</head>
<body data-page="admin-login">

  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/Dhoom Dhaam Diwali Fireworks Celebration.png"
             alt="Dhoom Dhaam Crackers"
             class="login-logo-img">
        <div class="login-title">Admin Panel</div>
        <div class="login-subtitle">Dhoom Dhaam Crackers – Scratch &amp; Win</div>
      </div>

      <div class="login-error" id="login-error" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="admin-username">Username</label>
          <input type="text"
                 id="admin-username"
                 class="form-input"
                 placeholder="Enter admin username"
                 autocomplete="username"
                 required>
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-password">Password</label>
          <input type="password"
                 id="admin-password"
                 class="form-input"
                 placeholder="Enter password"
                 autocomplete="current-password"
                 required>
        </div>

        <button type="submit" class="btn-login">
          🔐 Sign In to Dashboard
        </button>
      </form>

      <div class="login-hint">
        <p>Default: <code style="color:#FFD700">Paa</code> / <code style="color:#FFD700">Paa@8721</code></p>
        <p style="margin-top:8px; font-size:0.72rem; opacity:0.6;">
          Change credentials in Admin Dashboard → Settings
        </p>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs for Multi-Phone Cloud Sync -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
  <script>
    // Redirect if already logged in
    const s = getSession();
    if (s && s.loggedIn) {
      window.location.href = 'admin-dashboard.html';
    }
  </script>
</body>
</html>
